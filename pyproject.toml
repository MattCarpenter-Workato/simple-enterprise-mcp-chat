description = "A simple chatbot using OpenAI, Claude, and LM Studio with MCP"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.40",
    "urllib3>=2.7.0",   # security floor: CVE-2026-44431 et al. fixed in 2.7.0
]
